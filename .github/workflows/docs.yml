name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docs:
    uses: tandem-rng/.github/.github/workflows/docs.yml@main
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      title: tandem-sycl

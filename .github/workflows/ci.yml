name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# GitHub runners have no GPU, so the tests run on the CPU device: AdaptiveCpp's OpenMP backend on
# Linux and macOS, and DPC++ with Intel's OpenCL CPU runtime on Linux. Run the `cuda` pixi
# environment on a GPU host by hand.
jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AdaptiveCpp, ubuntu
            os: ubuntu-latest
            env: default
            dir: build/acpp
          - name: AdaptiveCpp, macOS
            os: macos-latest
            env: default
            dir: build/acpp
          - name: DPC++, ubuntu
            os: ubuntu-latest
            env: dpcpp
            dir: build/dpcpp
            cmake: -DCMAKE_CXX_COMPILER=icpx
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: ${{ matrix.env }}
          locked: false
      - run: >
          pixi run -e ${{ matrix.env }} cmake -S . -B ${{ matrix.dir }} -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DTANDEM_BENCH=ON ${{ matrix.cmake }}
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"
      - run: pixi run -e ${{ matrix.env }} cmake --build ${{ matrix.dir }}
      - run: pixi run -e ${{ matrix.env }} ctest --test-dir ${{ matrix.dir }} --output-on-failure
  upstream:
    name: vendored data match upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          git clone -q https://github.com/tandem-rng/spec ../tandem-spec
          python3 tools/gen_vectors.py ../tandem-spec/vectors.json > tests/vectors.hpp
          git diff --exit-code tests/vectors.hpp
      # The copies of the conformance files equal the spec's at the pinned commit, file for file.
      - run: |
          pin=2a4bd08205596bc12bb7ae102862c97a0477dc2e
          diff <(git -C ../tandem-spec ls-tree --name-only $pin conformance/ | grep '\.json$') \
               <(ls tests/conformance/*.json | sed 's|^tests/||')
          for f in tests/conformance/*.json; do
            git -C ../tandem-spec show "$pin:${f#tests/}" | cmp - "$f"
          done
  pin:
    name: tandem-cuda pin is on its main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          pin=$(git rev-parse HEAD:external/tandem-cuda)
          git clone -q --branch main https://github.com/tandem-rng/tandem-cuda ../tandem-cuda
          git -C ../tandem-cuda merge-base --is-ancestor "$pin" main
